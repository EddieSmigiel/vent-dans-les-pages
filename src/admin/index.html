<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administration — Du vent dans les pages</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
    <script>
    (function() {
        var p = sessionStorage.getItem("admin_ok");
        if (p !== "1") {
            var saisie = prompt("Mot de passe administration :");
            if (saisie !== "dvdlp2026") {
                document.body.innerText = "Accès refusé.";
                return;
            }
            sessionStorage.setItem("admin_ok", "1");
        }
        var s = document.createElement("script");
        s.src = "https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js";
        document.body.appendChild(s);
    })();
    </script>
</body>
</html>
